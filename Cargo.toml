[package]
name = "guitar-to-discord"
version = "0.2.0"
description = "Mix your guitar (sound card) and your mic into one virtual microphone for Discord."
license = "MIT"
repository = "https://github.com/VeqtaDev/GuitarToDiscord"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.37.0"
env_logger = "0.11.12"
log = "0.4.35"
rfd = "0.18.0"
ringbuf = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.1"

[features]
default = []
# Native ASIO support (Focusrite, RME...). Needs the Steinberg ASIO SDK
# (set CPAL_ASIO_DIR) and LLVM/clang for bindgen. See README.
asio = ["cpal/asio"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
